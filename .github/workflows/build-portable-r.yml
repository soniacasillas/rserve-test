name: Build portable R for DreamHost

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-portable-r.yml"
      - "index.php"
      - "diagnostics.php"
      - "src/**"
      - "r/**"
      - ".htaccess"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download micromamba
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/micromamba"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$RUNNER_TEMP/micromamba" bin/micromamba

      - name: Create R runtime (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          MM="$RUNNER_TEMP/micromamba/bin/micromamba"
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba-root"

          "$MM" create -y -p "$RUNNER_TEMP/r-env" -c conda-forge \
            'r-base=4.4.*' 'python=3.12.*'
          "$MM" create -y -p "$RUNNER_TEMP/packer" -c conda-forge conda-pack

          mkdir -p build
          "$RUNNER_TEMP/packer/bin/conda-pack" \
            -p "$RUNNER_TEMP/r-env" \
            -o build/runtime.tar.gz

      - name: Verify relocation and PHP-to-R execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          tar -xzf build/runtime.tar.gz -C runtime

          php index.php | tee build/test-output.txt
          grep -F "PHP ha executat R correctament." build/test-output.txt
          grep -F "Mitjana de 2, 4, 6 i 8: 5.0" build/test-output.txt
          test -f runtime/.relocated

          rm -rf runtime

      - name: Assemble upload bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site/r build/site/src
          cp index.php diagnostics.php .htaccess README.md build/site/
          cp r/hello.R build/site/r/
          cp src/PortableR.php build/site/src/
          mkdir -p build/site/runtime
          tar -xzf build/runtime.tar.gz -C build/site/runtime
          tar -czf build/rserve-test-dreamhost-linux-x86_64.tar.gz -C build/site .

      - name: Upload ready-to-copy bundle
        uses: actions/upload-artifact@v4
        with:
          name: rserve-test-dreamhost-linux-x86_64
          path: build/rserve-test-dreamhost-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
